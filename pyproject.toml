[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'agent-execution-guard'
version = '0.3.0'
description = 'Middleware that intercepts intermediate steps of an LLM agent'
readme = 'README.md'
requires-python = '>=3.10'
dependencies = ['pydantic>=2']

[project.optional-dependencies]
sql = ['sqlglot']
yaml = ['pyyaml']
dev = ['pytest', 'pytest-cov', 'hypothesis','ruff', 'mypy', 'sqlglot']

[tool.setuptools.packages.find]
include = ['agent_execution_guard*']

[tool.setuptools.package-data]
agent_execution_guard = ['py.typed']

[tool.pytest.ini_options]
testpaths = ['tests']

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = 'single'

[tool.mypy]
python_version = '3.10'
plugins = ['pydantic.mypy']

[tool.coverage.run]
branch = true
source = ['agent_execution_guard']

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    'if __name__ == .__main__.:',
]