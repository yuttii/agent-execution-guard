[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'agent-execution-guard'
version = '0.2.0'
description = 'Middleware that intercepts intermediate steps of an LLM agent'
readme = 'README.md'
requires-python = '>=3.10'
dependencies = []

[project.optional-dependencies]
sql = ['sqlglot']
dev = ['pytest', 'pytest-cov', 'hypothesis','ruff', 'mypy', 'sqlglot']

[tool.setuptools]
py-modules = ['guard']

[tool.pytest.ini_options]
testpaths = ['.']

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = 'single'

[tool.mypy]
python_version = '3.10'

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    'if __name__ == .__main__.:',
]