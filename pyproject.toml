[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'agent-execution-guard'
version = '0.1.0'
description = 'Middleware that intercepts intermediate steps of an LLM agent'
readme = 'README.md'
requires-python = '>=3.10'
dependencies = []

[project.optional-dependencies]
dev = ['pytest', 'ruff', 'mypy']

[tool.setuptools]
py-modules = ['guard']

[tool.pytest.ini_options]
testpaths = ['.']

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = '3.10'